<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Dashboard | AeroCore</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ========== Dashboard Layout ========== */
    body {
      background: var(--bg-alt);
      min-height: 100vh;
      overflow: hidden;
    }

    /* Top Bar */
    .topbar {
      background: var(--dark);
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .topbar-brand .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-logout {
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }
    .btn-logout:hover {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* App Shell — fills viewport below topbar */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Main Layout — table + sidebar */
    .main-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Left: Table Area */
    .table-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }

    /* Right: Detail Sidebar */
    .detail-sidebar {
      width: 420px;
      flex-shrink: 0;
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .sidebar-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
    }
    .sidebar-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 8px;
      padding: 40px;
      text-align: center;
    }
    .sidebar-empty-icon {
      font-size: 36px;
      opacity: 0.25;
    }
    .sidebar-empty p {
      font-size: 14px;
    }

    /* Stats Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      transition: all var(--transition);
    }
    .stat-card:hover { box-shadow: var(--shadow); }
    .stat-card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .stat-card-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .stat-card[data-stat="total"] .stat-card-value { color: var(--primary); }
    .stat-card[data-stat="new"] .stat-card-value { color: #3b82f6; }
    .stat-card[data-stat="quoted"] .stat-card-value { color: #8b5cf6; }
    .stat-card[data-stat="closed"] .stat-card-value { color: var(--success); }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .filter-bar label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .filter-bar select, .filter-bar input {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color var(--transition);
    }
    .filter-bar select:focus, .filter-bar input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-10);
    }
    .filter-search { flex: 1; min-width: 140px; }
    .filter-group { display: flex; align-items: center; gap: 5px; }
    .filter-date { width: 130px; }

    /* Submissions Table */
    .table-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .table-scroll {
      overflow: auto;
      flex: 1;
    }
    .submissions-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .submissions-table thead {
      background: var(--dark);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .submissions-table th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background var(--transition);
    }
    .submissions-table th:hover { background: var(--dark-3); }
    .submissions-table th .sort-icon {
      display: inline-block;
      margin-left: 4px;
      opacity: 0.4;
      font-size: 10px;
    }
    .submissions-table th.sort-active .sort-icon { opacity: 1; }
    .submissions-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }
    .submissions-table tbody tr {
      cursor: pointer;
      transition: background var(--transition);
    }
    .submissions-table tbody tr:hover { background: var(--primary-50); }
    .submissions-table tbody tr.active { background: var(--primary-light); }
    .submissions-table tbody tr:last-child td { border-bottom: none; }
    .submissions-table .cell-name { font-weight: 600; color: var(--text); }
    .submissions-table .cell-company { color: var(--text-light); }
    .submissions-table .cell-material {
      color: var(--text-light);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .submissions-table .cell-date {
      white-space: nowrap;
      color: var(--text-muted);
      font-size: 12px;
    }
    .submissions-table .cell-attachments { text-align: center; }

    /* Status Badges */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .badge-new { background: #dbeafe; color: #1d4ed8; }
    .badge-contacted { background: #ffedd5; color: #c2410c; }
    .badge-quoted { background: #ede9fe; color: #6d28d9; }
    .badge-closed { background: #dcfce7; color: #15803d; }
    .badge-spam { background: #fee2e2; color: #dc2626; }

    /* Action Button */
    .btn-view {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }
    .btn-view:hover { background: var(--primary); color: #fff; }

    /* Empty & Loading States */
    .table-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }
    .table-empty-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.3; }
    .table-empty p { font-size: 14px; }
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sidebar Panel Sections */
    .panel-section { margin-bottom: 20px; }
    .panel-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-light);
    }
    .panel-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .panel-field { display: flex; flex-direction: column; gap: 2px; }
    .panel-field.full-width { grid-column: 1 / -1; }
    .panel-field-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-muted);
    }
    .panel-field-value {
      font-size: 13px;
      color: var(--text);
      word-break: break-word;
    }
    .panel-field-value a { color: var(--primary); }
    .panel-field-value a:hover { text-decoration: underline; }
    .panel-message {
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
      background: var(--bg-alt);
      border-radius: var(--radius);
      padding: 12px 14px;
      border: 1px solid var(--border-light);
    }

    /* Attachments */
    .panel-attachments { display: flex; flex-wrap: wrap; gap: 8px; }
    .attachment-thumb {
      width: 64px; height: 64px;
      border-radius: var(--radius);
      object-fit: cover;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
    }
    .attachment-thumb:hover { border-color: var(--primary); box-shadow: var(--shadow); }
    .attachment-file {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--primary);
      font-weight: 500;
      text-decoration: none;
      transition: all var(--transition);
    }
    .attachment-file:hover { background: var(--primary-light); border-color: var(--primary); }
    .attachment-file svg { flex-shrink: 0; }

    /* UTM Data */
    .utm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .utm-item {
      font-size: 11px;
      padding: 5px 8px;
      background: var(--bg-alt);
      border-radius: var(--radius);
      border: 1px solid var(--border-light);
    }
    .utm-item strong {
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.3px;
      display: block;
      margin-bottom: 1px;
    }
    .utm-item span { color: var(--text); font-weight: 500; }

    /* Status & Notes */
    .panel-status-row { display: flex; align-items: center; gap: 10px; }
    .panel-status-select {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
    }
    .panel-status-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-10);
    }
    .panel-notes-area {
      width: 100%;
      min-height: 80px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      resize: vertical;
      line-height: 1.6;
    }
    .panel-notes-area:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-10);
    }
    .panel-actions { display: flex; gap: 8px; margin-top: 8px; }

    /* Delete button */
    .btn-delete {
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }
    .btn-delete:hover { background: #fee2e2; border-color: #dc2626; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      background: var(--dark);
      color: #fff;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 300;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast.toast-success { background: var(--success); }
    .toast.toast-error { background: #dc2626; }

    /* ========== Responsive ========== */
    @media (max-width: 1024px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .detail-sidebar { width: 340px; }
    }
    @media (max-width: 768px) {
      .main-layout { flex-direction: column; }
      .detail-sidebar {
        width: 100%;
        border-left: none;
        border-top: 1px solid var(--border);
        max-height: 50vh;
      }
      .table-area { overflow-y: auto; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-search { min-width: 100%; }
      .filter-date { width: 100%; }
      .panel-fields { grid-template-columns: 1fr; }
      .utm-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr; }
      .table-area { padding: 12px; }
    }
  </style>
</head>
<body>

<div class="app-shell">

  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="logo-icon">A</div>
      <span>AeroCore CRM</span>
    </div>
    <div class="topbar-right">
      <button id="btn-logout" class="btn-logout">Logout</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="main-layout">

    <!-- Left: Table Area -->
    <div class="table-area">
      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-card" data-stat="total">
          <div class="stat-card-label">Total Submissions</div>
          <div class="stat-card-value" id="stat-total">--</div>
        </div>
        <div class="stat-card" data-stat="new">
          <div class="stat-card-label">New</div>
          <div class="stat-card-value" id="stat-new">--</div>
        </div>
        <div class="stat-card" data-stat="quoted">
          <div class="stat-card-label">Quoted</div>
          <div class="stat-card-value" id="stat-quoted">--</div>
        </div>
        <div class="stat-card" data-stat="closed">
          <div class="stat-card-label">Closed</div>
          <div class="stat-card-value" id="stat-closed">--</div>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="filter-group">
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="">All</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="quoted">Quoted</option>
            <option value="closed">Closed</option>
            <option value="spam">Spam</option>
          </select>
        </div>
        <input type="search" id="filter-search" class="filter-search" placeholder="Search name, company, material...">
        <div class="filter-group">
          <label for="filter-from">From</label>
          <input type="date" id="filter-from" class="filter-date">
        </div>
        <div class="filter-group">
          <label for="filter-to">To</label>
          <input type="date" id="filter-to" class="filter-date">
        </div>
      </div>

      <!-- Submissions Table -->
      <div class="table-wrap">
        <div class="table-scroll">
          <table class="submissions-table">
            <thead>
              <tr>
                <th data-sort="created_at">Date <span class="sort-icon">&#9650;</span></th>
                <th data-sort="name">Name <span class="sort-icon">&#9650;</span></th>
                <th data-sort="company">Company <span class="sort-icon">&#9650;</span></th>
                <th data-sort="material">Material <span class="sort-icon">&#9650;</span></th>
                <th data-sort="status">Status <span class="sort-icon">&#9650;</span></th>
                <th>Files</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="submissions-body">
              <tr>
                <td colspan="7" class="table-empty">
                  <div class="loading-spinner"></div>
                  <p style="margin-top:12px">Loading submissions...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Right: Detail Sidebar (always visible) -->
    <aside class="detail-sidebar">
      <div class="sidebar-header">
        <h2 id="panel-title">Details</h2>
      </div>
      <div class="sidebar-body" id="panel-body">
        <div class="sidebar-empty">
          <div class="sidebar-empty-icon">&#128203;</div>
          <p>Select a submission to view details</p>
        </div>
      </div>
      <div class="sidebar-footer" id="panel-footer" style="display:none">
        <button id="btn-delete" class="btn-delete">Delete Submission</button>
      </div>
    </aside>

  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Keep old IDs for JS compatibility -->
<div id="panel-overlay" style="display:none"></div>
<div id="detail-panel" style="display:none"></div>
<button id="panel-close" style="display:none"></button>

<script src="/js/admin.js"></script>
</body>
</html>
