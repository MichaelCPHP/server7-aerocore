<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | AeroCore</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark-2) 50%, var(--dark-3) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--bg);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .login-logo .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      color: #fff;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
    }
    .login-logo .logo-text {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .login-logo .logo-text strong {
      font-weight: 700;
    }
    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 8px;
    }
    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 28px;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .login-form .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }
    .login-form .form-group input {
      padding: 12px 14px;
      font-size: 14px;
    }
    .login-error {
      display: none;
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      color: #dc2626;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
    .login-error.visible {
      display: block;
    }
    .login-btn {
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">A</div>
      <span class="logo-text"><strong>Aero</strong>Core</span>
    </div>
    <h1 class="login-title">Admin Login</h1>
    <p class="login-subtitle">Sign in to access the CRM dashboard</p>

    <div id="login-error" class="login-error"></div>

    <form id="login-form" class="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required placeholder="Enter username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg login-btn">Log In</button>
    </form>
  </div>

  <script>
    (function () {
      var form = document.getElementById('login-form');
      var errorEl = document.getElementById('login-error');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.classList.remove('visible');
        errorEl.textContent = '';

        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;

        if (!username || !password) {
          showError('Please enter both username and password.');
          return;
        }

        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (res) {
            if (res.ok) return res.json();
            return res.json().then(function (data) {
              throw new Error(data.error || 'Invalid credentials');
            });
          })
          .then(function () {
            window.location.href = '/admin/dashboard/';
          })
          .catch(function (err) {
            showError(err.message || 'Login failed. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Log In';
          });
      });

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add('visible');
      }
    })();
  </script>
</body>
</html>
